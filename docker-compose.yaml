services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data/z-prefix-inventory-app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    
  api:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: postgres
    depends_on:
      db:
        condition: service_healthy
    command:
      sh -c "npx knex migrate:latest && npx knex seed:run && npm start"

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"

volumes:
  pgdata: