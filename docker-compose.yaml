services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-init:
    build: ./backend
    command: >
      sh -c "
        if npx knex migrate:list | grep -q 'No Completed Migration'; then
          npx knex migrate:latest && npx knex seed:run;
        else
          npx knex migrate:latest;
        fi
      "
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: postgres
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    
  api:
    build: ./backend
    ports:
      - "${API_PORT}:3000"
    environment:
      API_PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_PORT: ${FRONTEND_PORT}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    command:
      sh -c "npm start"

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT}:8080"

volumes:
  pgdata: